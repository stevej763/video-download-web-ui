services:
  yt-dlp-webui:
    build: .
    ports:
      - "8787:8787"
    volumes:
      - local-downloads:/app/webui/downloads
    restart: unless-stopped

# Plain local Docker volume. docker-compose.override.yml (loaded automatically
# unless COMPOSE_FILE is set in .env) swaps this for the NAS share.
volumes:
  local-downloads:
