services:
  yt-dlp-webui:
    build: .
    ports:
      - "8787:8787"
    volumes:
      - nas-downloads:/app/webui/downloads
    restart: unless-stopped

volumes:
  nas-downloads:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${NAS_USER},password=${NAS_PASS},vers=3.0,uid=1000,gid=1000,file_mode=0664,dir_mode=0775,rw"
      device: "//${NAS_HOST}/${NAS_SHARE}"
